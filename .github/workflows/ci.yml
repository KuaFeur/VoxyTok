name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI executes repository code, including build scripts and tests. It needs no write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voxytok
          POSTGRES_PASSWORD: voxytok_ci_password
          POSTGRES_DB: voxytok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxytok -d voxytok_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://voxytok:voxytok_ci_password@localhost:5432/voxytok_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Discord.js example syntax
        run: node --check examples/discord.js/index.js
      - name: Validate Pelican egg JSON
        run: python -m json.tool deploy/pelican/egg-voxytok.json >/dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Check whitespace errors
        run: git diff --check
      - name: Compile all targets
        run: cargo check --locked --all-targets
      - name: Run unit and PostgreSQL integration tests
        run: cargo test --locked --all-targets
      - name: Run strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  container:
    name: Container build and smoke test
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: voxytok:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test embedded PostgreSQL and HTTP API
        run: |
          docker run -d --name voxytok-ci -p 8080:8080 \
            -e API_TOKEN=ci_api_token_0123456789_abcdefghijklmnop \
            -e POSTGRES_PASSWORD=ci_postgres_password_0123456789 \
            voxytok:ci
          cleanup() {
            docker logs voxytok-ci || true
            docker rm -f voxytok-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "VoxyTok did not become ready in time" >&2
              exit 1
            fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/creators)" = "401"
          curl --silent --fail \
            -H "Authorization: Bearer ci_api_token_0123456789_abcdefghijklmnop" \
            http://127.0.0.1:8080/api/v1/creators | grep -q '^\[\]$'
          curl --silent --fail -X POST \
            -H "Authorization: Bearer ci_api_token_0123456789_abcdefghijklmnop" \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_creator"}' \
            http://127.0.0.1:8080/api/v1/creators > /tmp/voxytok-creator.json
          CREATOR_ID="$(python3 -c 'import json; print(json.load(open("/tmp/voxytok-creator.json"))["id"])')"
          test -n "$CREATOR_ID"
          curl --silent --fail \
            -H "Authorization: Bearer ci_api_token_0123456789_abcdefghijklmnop" \
            "http://127.0.0.1:8080/api/v1/creators/$CREATOR_ID/sources" | grep -q '^\[\]$'

  publish-latest:
    name: Publish latest container
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/kuafeur/voxytok:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
