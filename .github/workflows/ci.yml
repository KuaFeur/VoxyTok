name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voxytok
          POSTGRES_PASSWORD: voxytok_ci_password
          POSTGRES_DB: voxytok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxytok -d voxytok_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://voxytok:voxytok_ci_password@localhost:5432/voxytok_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check examples/discord.js/index.js
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: voxytok:ci

      - name: Smoke-test embedded PostgreSQL and HTTP API
        run: |
          docker run -d --name voxytok-ci -p 8080:8080 \
            -e API_TOKEN=ci_api_token_0123456789_abcdefghijklmnop \
            -e POSTGRES_PASSWORD=ci_postgres_password_0123456789 \
            voxytok:ci
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs voxytok-ci
              exit 1
            fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/creators)" = "401"
          curl --silent --fail -H "Authorization: Bearer ci_api_token_0123456789_abcdefghijklmnop" \
            http://127.0.0.1:8080/api/v1/creators | grep -q '^\[\]$'
          docker rm -f voxytok-ci
