name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voxytok
          POSTGRES_PASSWORD: voxytok_ci_password
          POSTGRES_DB: voxytok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxytok -d voxytok_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://voxytok:voxytok_ci_password@localhost:5432/voxytok_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check examples/discord.js/index.js
      - name: Validate Pelican egg JSON
        run: python -m json.tool deploy/pelican/egg-voxytok.json >/dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Commit Cargo.lock on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const path = 'Cargo.lock';
            const content = fs.readFileSync(path, 'utf8');
            let existing = null;
            try {
              existing = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing && !Array.isArray(existing.data) &&
                Buffer.from(existing.data.content, 'base64').toString('utf8') === content) {
              core.info('Cargo.lock is already up to date.');
              return;
            }
            const payload = {
              owner, repo, path,
              message: 'build: add or update Cargo.lock',
              content: Buffer.from(content, 'utf8').toString('base64'),
              branch: 'main',
            };
            if (existing && !Array.isArray(existing.data)) payload.sha = existing.data.sha;
            await github.rest.repos.createOrUpdateFileContents(payload);

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error

  container:
    name: Container build
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lockfile
          path: .
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: voxytok:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test embedded PostgreSQL and HTTP API
        run: |
          docker run -d --name voxytok-ci -p 8080:8080 \
            -e API_TOKEN=ci_api_token_0123456789_abcdefghijklmnop \
            -e POSTGRES_PASSWORD=ci_postgres_password_0123456789 \
            voxytok:ci
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs voxytok-ci
              exit 1
            fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/creators)" = "401"
          curl --silent --fail -H "Authorization: Bearer ci_api_token_0123456789_abcdefghijklmnop" \
            http://127.0.0.1:8080/api/v1/creators | grep -q '^\[\]$'
          docker rm -f voxytok-ci

  publish-latest:
    name: Publish latest container
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/kuafeur/voxytok:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
