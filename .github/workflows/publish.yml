name: Publish container

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kuafeur/voxytok

jobs:
  verify:
    name: Verify release commit was tested
    runs-on: ubuntu-latest
    steps:
      - name: Require successful main CI for this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const result = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "ci.yml",
              head_sha: context.sha,
              status: "completed",
              per_page: 100,
            });
            const verified = result.data.workflow_runs.some(run =>
              run.head_sha === context.sha &&
              run.head_branch === "main" &&
              run.event === "push" &&
              run.conclusion === "success"
            );
            if (!verified) {
              core.setFailed(
                `Refusing to publish ${context.ref_name}: no successful main-branch CI run exists for commit ${context.sha}.`
              );
            } else {
              core.info(`Commit ${context.sha} has a successful main-branch CI run.`);
            }

  publish:
    name: Build and publish release image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag and prepare image tags
        id: tags
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must follow semantic versioning (for example v1.0.0 or v1.0.0-rc.1)." >&2
            exit 1
          fi
          tags="$REGISTRY/$IMAGE_NAME:$GITHUB_REF_NAME"
          # A prerelease (alpha, beta, rc) must never replace the stable latest tag.
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags+=$'\n'"$REGISTRY/$IMAGE_NAME:latest"
          fi
          {
            echo "value<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push verified release image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable release image reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          {
            echo "### Published release image"
            echo "- Immutable image: `$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST`"
            echo "- Release tag: `$GITHUB_REF_NAME`"
            echo "- Source commit: `$GITHUB_SHA`"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
