[package]
name = "voxytok"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Self-hosted TikTok publication event gateway"
repository = "https://github.com/KuaFeur/VoxyTok"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
